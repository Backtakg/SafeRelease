<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:#fff;padding:25px 17px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 30px}.brand-mark{width:39px;height:39px;border-radius:13px;background:var(--accent);color:var(--navy);display:grid;place-items:center;font-size:21px;font-weight:800}.brand-name{font:800 18px Poppins}.brand-sub{font-size:10px;color:#a9bed1;letter-spacing:1.2px;margin-top:2px}.nav-label{font-size:10px;color:#829bb2;font-weight:700;letter-spacing:1.5px;padding:12px 12px 9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c4d2df;text-align:left;padding:12px 13px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:#285481;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;padding:15px 10px 0;border-top:1px solid #2d4b65;color:#a9bed1;font-size:11px;line-height:1.6}.demo-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #42627d;padding:6px 9px;border-radius:20px;color:#dce8f3;margin-bottom:10px}.dot{width:6px;height:6px;background:#59d6a1;border-radius:50%}.main{margin-left:248px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{color:var(--muted);font-size:12px}.top-title{font:700 16px Poppins;margin-top:3px}.top-right{display:flex;align-items:center;gap:12px}.school-select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink)}.avatar{width:36px;height:36px;background:#e8 adding:18px 19px}.queue-row{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f3f6}.queue-row:last-child{border:0}.student-avatar{width:36px;height:36px;border-radius:11px;background:#edf3fc;color:#315c91;display:grid;place-items:center;font-weight:800}.person-name{font-weight:700;font-size:13px}.person-meta{font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}.status.wait{background:#fff3df;color:#a56a0e}.status.ready{background:#e6f7ef;color:#16845b}.status.done{background:#edf1f5;color:#607185}.status.flag{background:#ffeded;color:#c13f48}.activity{display:grid;gap:15px}.activity-item{display:flex;gap:10px}.activity-icon{width:29px;height:29px;border-radius:9px;background:#eff4fb;display:grid;place-items:center;flex-shrink:0}.activity-text{font-size:12px;line-height:1.5}.activity-time{font-size:10px;color:var(--muted);margin-top:3px}.notice{padding:14px;border-radius:11px;background:#f0f6ff;border:1px solid #dce8fb;color:#36577a;font-size:12px;line-height:1.6;margin-top:17px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;background:#fafbfd;color:#7b8a9b;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:12px 15px;border-bottom:1px solid var(--line)}.table td{padding:14px 15px;border-bottom:1px solid #f0f3f6;font-size:12px}.table tr:last-child td{border:0}.search{border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:210px;outline:none}.search:focus,input:focus,select:focus{border-color:#7da6ef;box-shadow:0 0 0 3px #1e5aa817;outline:none}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 18px}.tab{border:0;background:none;padding:13px 12px;color:var(--muted);font-weight:700;font-size:12px;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#526579}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);width:100%}.field textarea{min-height:80px;resize:vertical}.modal-backdrop{position:fixed;inset:0;background:#10243b80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #06172c50}.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{font:800 16px Poppins;margin:0}.modal-content{padding:21px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:15px 21px;border-top:1px solid var(--line)}.x{border:0;background:#f1f4f8;border-radius:8px;width:30px;height:30px;font-size:18px;color:#64748b}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.code-box{background:#f4f7fb;border:1px dashed #b8c8da;border-radius:12px;padding:16px;text-align:center}.code{font:800 25px Poppins;letter-spacing:4px;color:var(--navy);margin:8px 0}.qr-wrap{display:inline-block;background:#fff;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{padding:12px;background:#f7f9fc;border-radius:9px}.detail small{color:var(--muted);display:block;margin-bottom:5px}.detail strong{font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}.risk{background:#fff8e9;border:1px solid #f5e4be;padding:13px 15px;border-radius:10px;font-size:12px;color:#8d651e;line-height:1.5}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.feature{border:1px solid var(--line);border-radius:12px;padding:16px}.feature .ficon{font-size:20px;margin-bottom:9px}.feature h4{font:700 13px Poppins;margin:0 0 6px}.feature p{font-size:11px;color:var(--muted);line-height:1.6;margin:0}.toggle{accent-color:var(--blue);width:16px;height:16px}
@media(max-width:1000px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:24px}.topbar{padding:0 24px}.stats{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}.feature-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{width:250px;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin:0}.topbar{height:65px;padding:0 16px}.mobile-menu{display:inline-flex}.school-select{display:none}.content{padding:22px 15px 40px}.page-head{align-items:flex-start}.h1{font-size:23px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:24px}.stat-foot{font-size:10px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.feature-grid{grid-template-columns:1fr}.toolbar{width:100%}.search{min-width:0;flex:1}.page-head .btn{padding:9px 10px}.top-right{gap:7px}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">✓</div><div><div class="brand-name">SafeRelease</div><div class="brand-sub">STUDENT DISMISSAL</div></div></div>
 <div class="nav-label">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="overview"><span class="ico">▦</span>Overview</button>
  <button data-page="students"><span class="ico">♙</span>Students</button>
  <button data-page="guardians"><span class="ico">♧</span>Guardians & access</button>
  <button data-page="pickup"><span class="ico">⌁</span>Pickup verification</button>
  <button data-page="history"><span class="ico">◷</span>Handover history</button>
 </nav>
 <div class="nav-label" style="margin-top:18px">MANAGEMENT</div>
 <nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav>
 <div class="sidebar-bottom"><div class="demo-pill"><span class="dot"></span> DEMO ENVIRONMENT</div><div>SafeRelease concept prototype<br>Sample data only · No live school connection</div></div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary small mobile-menu" id="menuBtn">☰</button><div><div class="crumb">School operations / <span id="crumb">Overview</span></div><div class="top-title" id="topTitle">Good morning, Admin</div></div></div><div class="top-right"><select class="school-select" aria-label="School"><option>Evergreen Academy · Demo</option></select><div class="avatar">A</div></div></header>
 <section class="content" id="view"></section>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Add record</h3><button class="x" id="modalClose">×</button></div><div class="modal-content" id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='saferelease_v1';
const seed={
 students:[
 {id:'ST-1001',name:'Aarav Sharma',grade:'Grade 5 · A',roll:'05',guardians:['GU-2001'],status:'On campus'},
 {id:'ST-1002',name:'Aanya Karki',grade:'Grade 3 · B',roll:'12',guardians:['GU-2002'],status:'On campus'},
 {id:'ST-1003',name:'Rohan Thapa',grade:'Grade 7 · A',roll:'08',guardians:['GU-2003'],status:'On campus'},
 {id:'ST-1004',name:'Saanvi Shrestha',grade:'Grade 2 · A',roll:'03',guardians:['GU-2004'],status:'On campus'},
 {id:'ST-1005',name:'Vivaan Gurung',grade:'Grade 6 · C',roll:'17',guardians:['GU-2005'],status:'On campus'},
 {id:'ST-1006',name:'Diya Adhikari',grade:'Grade 4 · B',roll:'09',guardians:['GU-2006'],status:'On campus'}
 ],
 guardians:[
 {id:'GU-2001',name:'Ramesh Sharma',phone:'98XXXXXXXX',relation:'Father',students:['ST-1001'],verified:true},
 {id:'GU-2002',name:'Mina Karki',phone:'98XXXXXXXX',relation:'Mother',students:['ST-1002'],verified:true},
 {id:'GU-2003',name:'Suresh Thapa',phone:'98XXXXXXXX',relation:'Father',students:['ST-1003'],verified:true},
 {id:'GU-2004',name:'Nisha Shrestha',phone:'98XXXXXXXX',relation:'Mother',students:['ST-1004'],verified:true},
 {id:'GU-2005',name:'Kamal Gurung',phone:'98XXXXXXXX',relation:'Uncle',students:['ST-1005'],verified:true},
 {id:'GU-2006',name:'Puja Adhikari',phone:'98XXXXXXXX',relation:'Mother',students:['ST-1006'],verified:true}
 ],
 passes:[
 {id:'PR-501',student:'ST-1001',guardian:'GU-2001',code:'482916',date:today(),time:'15:10',status:'Ready',type:'Regular pickup'},
 {id:'PR-502',student:'ST-1002',guardian:'GU-2002',code:'735204',date:today(),time:'15:15',status:'Ready',type:'Regular pickup'},
 {id:'PR-503',student:'ST-1003',guardian:'GU-2003',code:'193857',date:today(),time:'15:20',status:'Awaiting',type:'Regular pickup'},
 {id:'PR-504',student:'ST-1004',guardian:'GU-2004',code:'628401',date:today(),time:'15:25',status:'Ready',type:'Regular pickup'}
 ],
 history:[
 {id:'HR-401',student:'ST-1005',guardian:'GU-2005',time:'14:42',date:today(),staff:'Sita Rai',method:'Code verified',note:'Standard pickup'},
 {id:'HR-400',student:'ST-1006',guardian:'GU-2006',time:'14:35',date:today(),staff:'Bikash KC',method:'QR verified',note:'Standard pickup'}
 ],
 requests:[
 {id:'CH-101',student:'ST-1003',from:'Suresh Thapa',to:'Anil Thapa',reason:'Father is delayed; uncle will collect.',status:'Pending'}
 ],
 settings:{school:'Evergreen Academy',releaseStart:'15:00',releaseEnd:'16:00',requireCode:true,requireGuardian:true}
};
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
let db=load(),page='overview',searchTerm='';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function student(id){return db.students.find(x=>x.id===id)||{name:'Unknown student',grade:'—'}}
function guardian(id){return db.guardians.find(x=>x.id===id)||{name:'Unknown guardian',relation:'—'}}
function initials(name){return (name||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function statusClass(s){return s==='Ready'?'ready':s==='Completed'?'done':s==='Flagged'?'flag':'wait'}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function render(){document.getElementById('crumb').textContent=({overview:'Overview',students:'Students',guardians:'Guardians & access',pickup:'Pickup verification',history:'Handover history',settings:'Settings'})[page];document.getElementById('topTitle').textContent=page==='overview'?'Good morning, Admin':({students:'Student directory',guardians:'Authorised pickup contacts',pickup:'Verify a student handover',history:'Verified handover records',settings:'School configuration'})[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('view').innerHTML=({overview:overview,students:studentsPage,guardians:guardiansPage,pickup:pickupPage,history:historyPage,settings:settingsPage})[page]();document.getElementById('sidebar').classList.remove('open')}
function overview(){
 const ready=db.passes.filter(p=>p.date===today()&&p.status==='Ready').length,done=db.history.filter(h=>h.date===today()).length,pending=db.requests.filter(r=>r.status==='Pending').length;
 const recent=db.passes.filter(p=>p.date===today()).slice(0,5);
 return `<div class="page-head"><div><div class="eyebrow">LIVE DISMISSAL CONTROL</div><h1 class="h1">School overview</h1><div class="sub">A clear view of today's student release activity and pickup approvals.</div></div><button class="btn primary" onclick="go('pickup')">＋ Verify pickup</button></div>
 <div class="stats">
 <div class="stat"><div class="stat-top">Registered students <span class="stat-icon">♙</span></div><div class="stat-value">${db.students.length}</div><div class="stat-foot">In this demo school</div></div>
 <div class="stat"><div class="stat-top">Ready for pickup <span class="stat-icon">⌁</span></div><div class="stat-value">${ready}</div><div class="stat-foot green-text">Approved pickup passes</div></div>
 <div class="stat"><div class="stat-top">Released today <span class="stat-icon">✓</span></div><div class="stat-value">${done}</div><div class="stat-foot">Verified handovers recorded</div></div>
 <div class="stat"><div class="stat-top">Change requests <span class="stat-icon">↻</span></div><div class="stat-value">${pending}</div><div class="stat-foot ${pending?'amber-text':'green-text'}">${pending?'Require staff review':'No pending requests'}</div></div>
 </div>
 <div class="grid-main"><div class="panel"><div class="panel-head"><div><div class="panel-title">Today's pickup queue</div><div class="panel-sub">Scheduled student handovers</div></div><button class="btn secondary small" onclick="go('pickup')">Open queue →</button></div><div class="panel-body">${recent.length?recent.map(p=>{const s=student(p.student),g=guardian(p.guardian);return `<div class="queue-row"><div class="student-avatar">${initials(s.name)}</div><div><div class="person-name">${esc(s.name)}</div><div class="person-meta">${esc(s.grade)} · ${esc(g.name)} · ${esc(p.time)}</div></div><span class="status ${statusClass(p.status)}">${esc(p.status)}</span></div>`}).join(''):'<div class="empty">No pickups scheduled today.</div>'}</div></div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Recent activity</div><div class="panel-sub">Latest verified handovers</div></div><button class="btn secondary small" onclick="go('history')">View all</button></div><div class="panel-body"><div class="activity">${db.history.slice(0,4).map(h=>`<div class="activity-item"><div class="activity-icon">✓</div><div><div class="activity-text"><b>${esc(student(h.student).name)}</b> released to ${esc(guardian(h.guardian).name)}</div><div class="activity-time">${esc(h.time)} · ${esc(h.method)} · ${esc(h.staff)}</div></div></div>`).join('')||'<div class="empty">No handovers yet.</div>'}</div>${pending?'<div class="notice">⚠ '+pending+' pickup-change request(s) need review. Check Guardians & access.</div>':'<div class="notice">✓ All clear. Remember to verify the authorised guardian before every handover.</div>'}</div></div></div>
 <div class="panel" style="margin-top:17px"><div class="panel-head"><div><div class="panel-title">Safe handover workflow</div><div class="panel-sub">Three steps for every dismissal</div></div></div><div class="panel-body"><div class="feature-grid"><div class="feature"><div class="ficon">①</div><h4>Confirm identity</h4><p>Find the student and check the authorised guardian or approved pickup change.</p></div><div class="feature"><div class="ficon">②</div><h4>Verify pickup pass</h4><p>Scan the QR or enter the one-time code. Check the student and guardian details.</p></div><div class="feature"><div class="ficon">③</div><h4>Record handover</h4><p>Confirm release to create a timestamped audit entry in the handover history.</p></div></div></div></div>`
}
function studentsPage(){return `<div class="page-head"><div><div class="eyebrow">DIRECTORY</div><h1 class="h1">Students</h1><div class="sub">Manage student records used during pickup verification.</div></div><button class="btn primary" onclick="studentModal()">＋ Add student</button></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Student directory</div><div class="panel-sub">${db.students.length} students registered</div></div><input class="search" placeholder="Search student or ID..." oninput="searchTerm=this.value;document.getElementById('studentRows').innerHTML=studentRows()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Student ID</th><th>Class</th><th>Authorised contacts</th><th>Action</th></tr></thead><tbody id="studentRows">${studentRows()}</tbody></table></div></div>`}
function studentRows(){const q=searchTerm.toLowerCase();const arr=db.students.filter(s=>(s.name+s.id+s.grade).toLowerCase().includes(q));return arr.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.id}</td><td>${esc(s.grade)}</td><td>${s.guardians.length} contact(s)</td><td><button class="btn secondary small" onclick="studentDetail('${s.id}')">View</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching students.</td></tr>'}
function guardiansPage(){return `<div class="page-head"><div><div class="eyebrow">ACCESS CONTROL</div><h1 class="h1">Guardians & access</h1><div class="sub">Only approved contacts should collect a student.</div></div><button class="btn primary" onclick="guardianModal()">＋ Add guardian</button></div>${db.requests.filter(r=>r.status==='Pending').length?`<div class="risk" style="margin-bottom:15px">⚠ <b>Pending pickup changes:</b> ${db.requests.filter(r=>r.status==='Pending').length} request(s) need staff approval. Verify identity through your school's normal process before approving.</div>`:''}<div class="panel"><div class="panel-head"><div><div class="panel-title">Authorised guardians</div><div class="panel-sub">Registered pickup contacts</div></div><input class="search" placeholder="Search guardian..." oninput="searchTerm=this.value;document.getElementById('guardianRows').innerHTML=guardianRows()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Guardian</th><th>Guardian ID</th><th>Relationship</th><th>Linked students</th><th>Verification</th></tr></thead><tbody id="guardianRows">${guardianRows()}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Pickup change requests</div><div class="panel-sub">A temporary change must be reviewed by school staff</div></div></div><div class="panel-body">${db.requests.length?db.requests.map(r=>`<div class="queue-row"><div class="student-avatar">↻</div><div><div class="person-name">${esc(r.from)} → ${esc(r.to)}</div><div class="person-meta">${esc(student(r.student).name)} · ${esc(r.reason)}</div></div><div class="toolbar"><span class="status ${r.status==='Approved'?'ready':r.status==='Rejected'?'flag':'wait'}">${r.status}</span>${r.status==='Pending'?`<button class="btn primary small" onclick="reviewRequest('${r.id}',true)">Approve</button><button class="btn secondary small" onclick="reviewRequest('${r.id}',false)">Reject</button>`:''}</div></div>`).join(''):'<div class="empty">No pickup-change requests.</div>'}</div></div>`}
function guardianRows(){const q=searchTerm.toLowerCase();const arr=db.guardians.filter(g=>(g.name+g.id+g.relation).toLowerCase().includes(q));return arr.map(g=>`<tr><td><b>${esc(g.name)}</b><div class="person-meta">${esc(g.phone)}</div></td><td>${g.id}</td><td>${esc(g.relation)}</td><td>${g.students.map(id=>esc(student(id).name)).join(', ')}</td><td><span class="status ${g.verified?'ready':'wait'}">${g.verified?'Verified':'Unverified'}</span> ${!g.verified?`<button class="btn secondary small" onclick="verifyGuardian('${g.id}')">Verify</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching guardians.</td></tr>'}
function pickupPage(){const arr=db.passes.filter(p=>p.date===today());return `<div class="page-head"><div><div class="eyebrow">DISMISSAL DESK</div><h1 class="h1">Pickup verification</h1><div class="sub">Verify the pass, confirm the authorised person and record the handover.</div></div><button class="btn primary" onclick="passModal()">＋ Create pickup pass</button></div><div class="risk" style="margin-bottom:16px">Security reminder: a valid code alone is not sufficient. Staff must visually verify the collector's identity and confirm the student/guardian details before releasing a child.</div><div class="grid-main"><div class="panel"><div class="panel-head"><div><div class="panel-title">Today's pickup queue</div><div class="panel-sub">${arr.length} pass(es) scheduled for today</div></div><input class="search" placeholder="Search name or code..." oninput="searchTerm=this.value;document.getElementById('pickupRows').innerHTML=pickupRows()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Guardian</th><th>Time</th><th>Status</th><th></th></tr></thead><tbody id="pickupRows">${pickupRows()}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Quick verification</div><div class="panel-sub">Enter the 6-digit pickup code</div></div></div><div class="panel-body"><form onsubmit="verifyCode(event)"><div class="field"><label>Pickup code</label><input id="verifyInput" inputmode="numeric" maxlength="6" placeholder="e.g. 482916" required pattern="[0-9]{6}" style="font-size:22px;letter-spacing:5px;text-align:center;font-weight:800"></div><button class="btn primary" style="width:100%;margin-top:12px">Verify code →</button></form><div id="verifyResult" style="margin-top:14px"></div><div class="notice">For demo purposes, codes are generated locally. A production system must use secure, expiring, single-use tokens and authenticated staff accounts.</div></div></div></div>`}
function pickupRows(){const q=searchTerm.toLowerCase();const arr=db.passes.filter(p=>p.date===today()&&(student(p.student).name+p.code+guardian(p.guardian).name+p.status).toLowerCase().includes(q));return arr.map(p=>`<tr><td><b>${esc(student(p.student).name)}</b><div class="person-meta">${p.id}</div></td><td>${esc(guardian(p.guardian).name)}</td><td>${esc(p.time)}</td><td><span class="status ${statusClass(p.status)}">${esc(p.status)}</span></td><td><button class="btn secondary small" onclick="showPass('${p.id}')">Details</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No pickup passes found.</td></tr>'}
function historyPage(){return `<div class="page-head"><div><div class="eyebrow">AUDIT TRAIL</div><h1 class="h1">Handover history</h1><div class="sub">Review completed student releases and export the demo records.</div></div><button class="btn secondary" onclick="exportCSV()">↓ Export CSV</button></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Verified handovers</div><div class="panel-sub">${db.history.length} total records</div></div><input class="search" placeholder="Search student or guardian..." oninput="searchTerm=this.value;document.getElementById('historyRows').innerHTML=historyRows()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Time / date</th><th>Student</th><th>Released to</th><th>Verified by</th><th>Method</th><th>Record</th></tr></thead><tbody id="historyRows">${historyRows()}</tbody></table></div></div><div class="notice" style="margin-top:15px">Audit records in this prototype are stored in this browser only. A real deployment requires server-side, tamper-resistant logs, role-based access and retention policies.</div>`}
function historyRows(){const q=searchTerm.toLowerCase();const arr=db.history.filter(h=>(student(h.student).name+guardian(h.guardian).name+h.staff+h.method).toLowerCase().includes(q));return arr.map(h=>`<tr><td><b>${esc(h.time)}</b><div class="person-meta">${fmtDate(h.date)}</div></td><td>${esc(student(h.student).name)}</td><td>${esc(guardian(h.guardian).name)}</td><td>${esc(h.staff)}</td><td>${esc(h.method)}</td><td><span class="status done">Completed</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching records.</td></tr>'}
function settingsPage(){return `<div class="page-head"><div><div class="eyebrow">CONFIGURATION</div><h1 class="h1">Settings</h1><div class="sub">Configure the demonstration school and release workflow.</div></div><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="grid-main"><div class="panel"><div class="panel-head"><div class="panel-title">School settings</div></div><div class="panel-body"><div class="form-grid"><div class="field full"><label>School name</label><input id="setSchool" value="${esc(db.settings.school)}"></div><div class="field"><label>Release start</label><input type="time" id="setStart" value="${db.settings.releaseStart}"></div><div class="field"><label>Release end</label><input type="time" id="setEnd" value="${db.settings.releaseEnd}"></div><div class="field full"><label><input class="toggle" type="checkbox" id="setCode" ${db.settings.requireCode?'checked':''}> Require one-time pickup code</label></div><div class="field full"><label><input class="toggle" type="checkbox" id="setGuardian" ${db.settings.requireGuardian?'checked':''}> Require authorised guardian match</label></div></div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Demo data management</div></div><div class="panel-body"><p class="sub">All information is sample data saved in this browser's local storage.</p><button class="btn secondary" style="width:100%;margin-bottom:9px" onclick="exportCSV()">↓ Export handover CSV</button><button class="btn danger" style="width:100%" onclick="resetDemo()">Reset demo data</button><div class="notice">This is an independent concept demo. It is not connected to any school ERP, SMS provider, identity service or live student database.</div></div></div></div>`}
function go(p){page=p;searchTerm='';render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.querySelectorAll('.nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openModal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=actions;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function studentModal(){openModal('Add student',`<form id="studentForm" class="form-grid"><div class="field full"><label>Student full name</label><input name="name" required placeholder="e.g. Samir Shrestha"></div><div class="field"><label>Grade / section</label><input name="grade" required placeholder="Grade 4 · A"></div><div class="field"><label>Roll number</label><input name="roll" placeholder="e.g. 12"></div><div class="field full"><label>Authorised guardian</label><select name="guardian" required>${db.guardians.map(g=>`<option value="${g.id}">${esc(g.name)} · ${esc(g.relation)}</option>`).join('')}</select></div></form>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addStudent()">Add student</button>')}
function addStudent(){const f=document.getElementById('studentForm');if(!f.reportValidity())return;const d=new FormData(f),id='ST-'+Math.floor(1000+Math.random()*8999);const g=d.get('guardian');db.students.push({id,name:d.get('name'),grade:d.get('grade'),roll:d.get('roll'),guardians:g?[g]:[],status:'On campus'});if(g){const x=guardian(g);x.students.push(id)}save();closeModal();render();toast('Student added to demo directory')}
function guardianModal(){openModal('Add authorised guardian',`<form id="guardianForm" class="form-grid"><div class="field full"><label>Guardian full name</label><input name="name" required></div><div class="field"><label>Phone number (demo)</label><input name="phone" placeholder="98XXXXXXXX"></div><div class="field"><label>Relationship</label><select name="relation"><option>Mother</option><option>Father</option><option>Guardian</option><option>Grandparent</option><option>Uncle</option><option>Aunt</option><option>Other</option></select></div><div class="field full"><label>Link student</label><select name="student" required>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.grade)}</option>`).join('')}</select></div></form>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addGuardian()">Add guardian</button>')}
function addGuardian(){const f=document.getElementById('guardianForm');if(!f.reportValidity())return;const d=new FormData(f),id='GU-'+Math.floor(2000+Math.random()*7999),sid=d.get('student');db.guardians.push({id,name:d.get('name'),phone:d.get('phone'),relation:d.get('relation'),students:[sid],verified:false});student(sid).guardians.push(id);save();closeModal();render();toast('Guardian added — verification pending')}
function verifyGuardian(id){const g=guardian(id);if(!g||!confirm('Confirm that this guardian has been checked against school records?'))return;g.verified=true;save();render();toast('Guardian marked verified in demo')}
function passModal(){openModal('Create pickup pass',`<form id="passForm" class="form-grid"><div class="field full"><label>Student</label><select name="student" id="passStudent" required onchange="updatePassGuardians()">${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.grade)}</option>`).join('')}</select></div><div class="field full"><label>Authorised pickup contact</label><select name="guardian" id="passGuardian" required></select></div><div class="field"><label>Pickup date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Expected time</label><input name="time" type="time" value="15:30" required></div></form><div class="notice">A unique six-digit demo code will be generated. Real codes must be securely generated and expire automatically.</div>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createPass()">Create pass</button>');updatePassGuardians()}
function updatePassGuardians(){const s=document.getElementById('passStudent');if(!s)return;const g=document.getElementById('passGuardian');g.innerHTML=db.guardians.filter(x=>x.students.includes(s.value)&&x.verified).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.relation)}</option>`).join('');if(!g.options.length)g.innerHTML='<option value="">No verified guardian linked</option>'}
function createPass(){const f=document.getElementById('passForm');if(!f.reportValidity())return;const d=new FormData(f);if(!d.get('guardian')){toast('Link and verify a guardian first');return}let code=String(Math.floor(100000+Math.random()*900000));while(db.passes.some(p=>p.code===code&&p.date===d.get('date')))code=String(Math.floor(100000+Math.random()*900000));const p={id:'PR-'+Math.floor(500+Math.random()*9499),student:d.get('student'),guardian:d.get('guardian'),code,date:d.get('date'),time:d.get('time'),status:'Ready',type:'Regular pickup'};db.passes.unshift(p);save();closeModal();render();showPass(p.id);toast('Pickup pass created')}
function showPass(id){const p=db.passes.find(x=>x.id===id);if(!p)return;const s=student(p.student),g=guardian(p.guardian);openModal('Pickup pass · '+p.id,`<div class="code-box"><div class="eyebrow">ONE-TIME DEMO PICKUP CODE</div><div class="code">${p.code}</div><div class="sub">${fmtDate(p.date)} · ${esc(p.time)}</div><div class="qr-wrap"><div id="qrCode"></div></div><div class="sub" style="margin-top:9px">Show this pass to school staff for verification.</div></div><div class="detail-grid" style="margin-top:14px"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Authorised guardian</small><strong>${esc(g.name)}</strong></div><div class="detail"><small>Pass status</small><strong>${esc(p.status)}</strong></div></div><div class="risk" style="margin-top:12px">Demo only: QR contains a non-sensitive pass reference. Production implementation needs server-side token validation and expiry.</div>`,'<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="printPass(\''+p.id+'\')">Print pass</button>');if(window.QRCode){new QRCode(document.getElementById('qrCode'),{text:'SAFERELEASE|'+p.id+'|'+p.code,width:132,height:132,colorDark:'#173b68',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else document.getElementById('qrCode').innerHTML='<div style="padding:15px;font-size:11px">QR preview unavailable · use code above</div>'}
function printPass(id){const p=db.passes.find(x=>x.id===id),s=student(p.student),g=guardian(p.guardian);const w=window.open('','_blank');w.document.write('<html><title>SafeRelease pickup pass</title><body style="font-family:Arial;padding:35px;text-align:center"><h1>SafeRelease</h1><h2>Student pickup pass</h2><h1 style="letter-spacing:8px">'+p.code+'</h1><p>Student: '+esc(s.name)+' · '+esc(s.grade)+'</p><p>Authorised guardian: '+esc(g.name)+'</p><p>'+fmtDate(p.date)+' · '+p.time+'</p><p>DEMO ONLY — confirm collector identity with school records.</p></body></html>');w.document.close();w.print()}
function verifyCode(e){e.preventDefault();const code=document.getElementById('verifyInput').value.trim(),p=db.passes.find(x=>x.code===code&&x.date===today());const box=document.getElementById('verifyResult');if(!p){box.innerHTML='<div class="risk">No valid pickup pass found for this code and date. Do not release the student.</div>';return}if(p.status==='Completed'){box.innerHTML='<div class="risk">This pass has already been used. Do not release again.</div>';return}if(p.status!=='Ready'){box.innerHTML='<div class="risk">This pass is not approved for release.</div>';return}const s=student(p.student),g=guardian(p.guardian);box.innerHTML=`<div class="detail-grid"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Authorised guardian</small><strong>${esc(g.name)}</strong></div><div class="detail"><small>Relationship</small><strong>${esc(g.relation)}</strong></div></div><div class="notice">Match the adult's identity against the school's authorised records. A code is not proof of identity.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="confirmHandover('${p.id}')">Confirm verified handover</button>`}
function confirmHandover(id){const p=db.passes.find(x=>x.id===id);if(!p||p.status!=='Ready'){toast('Pass is no longer available');return}if(!confirm('Confirm that you personally checked the collector identity and are releasing '+student(p.student).name+' to '+guardian(p.guardian).name+'?'))return;p.status='Completed';db.history.unshift({id:'HR-'+Math.floor(400+Math.random()*9599),student:p.student,guardian:p.guardian,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:today(),staff:'Demo Admin',method:'Code verified',note:'Identity confirmed by staff'});save();render();toast('Handover recorded in demo history')}
function reviewRequest(id,approve){const r=db.requests.find(x=>x.id===id);if(!r)return;if(!confirm((approve?'Approve':'Reject')+' this pickup change request?'))return;r.status=approve?'Approved':'Rejected';save();render();toast('Request '+r.status.toLowerCase())}
function studentDetail(id){const s=student(id);openModal('Student record',`<div class="detail-grid"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Student ID</small><strong>${s.id}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Roll number</small><strong>${esc(s.roll)}</strong></div></div><h4 style="font:700 13px Poppins;margin:18px 0 8px">Authorised guardians</h4>${s.guardians.map(id=>`<div class="queue-row"><div class="student-avatar">${initials(guardian(id).name)}</div><div><div class="person-name">${esc(guardian(id).name)}</div><div class="person-meta">${esc(guardian(id).relation)} · ${guardian(id).verified?'Verified':'Pending verification'}</div></div></div>`).join('')||'<div class="sub">No guardian linked.</div>'}`,'<button class="btn secondary" onclick="closeModal()">Close</button>')}
function saveSettings(){db.settings={school:document.getElementById('setSchool').value,releaseStart:document.getElementById('setStart').value,releaseEnd:document.getElementById('setEnd').value,requireCode:document.getElementById('setCode').checked,requireGuardian:document.getElementById('setGuardian').checked};save();toast('Settings saved')}
function exportCSV(){const rows=[['Record ID','Date','Time','Student','Guardian','Staff','Method','Note'],...db.history.map(h=>[h.id,h.date,h.time,student(h.student).name,guardian(h.guardian).name,h.staff,h.method,h.note])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='saferelease-handover-history.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared')}
function resetDemo(){if(!confirm('Reset all demo records to the original sample data?'))return;db=structuredClone(seed);save();render();toast('Demo data reset')}
render();
</script>
</body></html>
