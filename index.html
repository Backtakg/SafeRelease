body.parent-mode{background:#f3f6fb}

.parent-app{min-height:100vh;background:#f3f6fb}
.parent-header{background:linear-gradient(135deg,#173b68,#245b91);color:#fff;padding:24px max(20px,calc((100% - 680px)/2)) 28px}

.parent-brand{font:800 18px Poppins;letter-spacing:-.4px}

.parent-header .btn{background:#ffffff1c;border:1px solid #ffffff45;color:#fff}

.parent-section{margin-top:22px}.parent-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.parent-section-head h2{font:700 15px Poppins;margin:0}.parent-section-head span{font-size:10px;color:#718096}

.parent-card .btn{font-size:11px}

.parent-form .btn{width:100%;padding:12px}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function statusClass(s){return s==='Ready'?'ready':s==='Completed'?'done':s==='Flagged'?'flag':'wait'}

function activateGuardianAccount(e){e.preventDefault();const code=document.getElementById('guardianInviteCode').value.trim().toUpperCase(),pin=document.getElementById('guardianNewPin').value,confirmPin=document.getElementById('guardianConfirmPin').value,invite=db.invites.find(x=>x.code===code&&x.status==='Pending');if(!invite){toast('Invitation not found or already used');return}if(Date.now()>invite.expiresAt){invite.status='Expired';save();toast('This invitation has expired. Ask your school for a new one.');return}if(pin!==confirmPin){toast('The PINs do not match');return}if(!/^[0-9]{6}$/.test(pin)){toast('Create a 6-digit numeric PIN');return}const g=guardian(invite.guardianId);if(!g||!g.verified){toast('Your guardian record must be verified by the school first');return}g.accountActivated=true;g.accountPin=pin;invite.status='Accepted';invite.acceptedAt=Date.now();save();activeGuardianId=g.id;toast('Account activated. Please sign in.');go('guardian-login')}

 return `<div class="page-head"><div><div class="eyebrow">GUARDIAN COMMUNICATION</div><h1 class="h1">Alerts & announcements</h1><div class="sub">Send important school updates and monitor guardian acknowledgements. Messages are simulated in this demo.</div></div><span class="status wait">DEMO ONLY</span></div>
 <div class="stats"><div class="stat"><div class="stat-top">Announcements sent</div><div class="stat-value">${items.length}</div><div class="stat-foot">Across this demo school</div></div><div class="stat"><div class="stat-top">Guardian recipients</div><div class="stat-value">${total}</div><div class="stat-foot">Simulated delivery targets</div></div><div class="stat"><div class="stat-top">Acknowledged</div><div class="stat-value">${acked}</div><div class="stat-foot green-text">Demo acknowledgements</div></div><div class="stat"><div class="stat-top">Awaiting acknowledgement</div><div class="stat-value">${total-acked}</div><div class="stat-foot amber-text">Follow-up may be needed</div></div></div>
 <div class="grid-main"><div class="panel"><div class="panel-head"><div><div class="panel-title">Create announcement</div><div class="panel-sub">Prepare an early dismissal or urgent school notice</div></div></div><div class="panel-body"><form class="form-grid" onsubmit="createAnnouncement(event)"><div class="field"><label>Alert type</label><select id="alertType"><option>Early dismissal</option><option>Emergency notice</option><option>Transport update</option><option>General announcement</option></select></div><div class="field"><label>Audience</label><select id="alertAudience" onchange="toggleAlertGrade()"><option value="all">All guardians</option><option value="grade">Specific grade</option></select></div><div class="field full" id="alertGradeWrap" style="display:none"><label>Grade / section (exact match)</label><input id="alertGrade" placeholder="e.g. Grade 5 · A"></div><div class="field full"><label>Announcement title</label><input id="alertTitle" required maxlength="90" placeholder="e.g. School closing early today"></div><div class="field full"><label>Message to guardians</label><textarea id="alertMessage" required rows="4" maxlength="500" placeholder="Explain what guardians need to know and what action they should take..."></textarea></div><div class="field full"><button class="btn primary" type="submit">↗ Create demo announcement</button></div></form><div class="panel-sub" style="margin-top:12px">No SMS, push notification or email is sent. This prototype records simulated recipients only.</div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Recent announcements</div><div class="panel-sub">Track guardian acknowledgement status</div></div></div><div class="panel-body">${items.length?items.map(a=>{const count=a.recipients.length,done=a.acknowledged.length;return `<div class="queue-row" style="align-items:flex-start"><div class="stat-icon">${a.type==='Emergency notice'?'⚠':'↗'}</div><div style="flex:1;min-width:0"><div class="person-name">${esc(a.title)}</div><div class="person-meta">${esc(a.type)} · ${esc(a.audience)} · ${new Date(a.createdAt).toLocaleString()}</div><div class="sub" style="margin:7px 0">${esc(a.message)}</div><div class="person-meta">${done} of ${count} guardians acknowledged</div><div class="progress" style="height:7px;background:var(--line);border-radius:8px;overflow:hidden;margin:7px 0 10px"><div style="height:100%;width:${count?done/count*100:0}%;background:var(--green)"></div></div><div style="display:flex;gap:7px;flex-wrap:wrap">${a.recipients.filter(id=>!a.acknowledged.includes(id)).slice(0,5).map(id=>`<button class="btn secondary small" onclick="acknowledgeAnnouncement('${a.id}','${id}')">Mark ${esc(guardian(id).name)} acknowledged</button>`).join('')}${a.recipients.filter(id=>!a.acknowledged.includes(id)).length>5?'<span class="person-meta">More recipients pending…</span>':''}</div></div></div>`}).join(''):'<div class="empty">No announcements yet. Create a demo notice to see the acknowledgement workflow.</div>'}</div></div></div>`;
}
function guardianPortalPage(){
 const g=guardian(activeGuardianId),kids=db.students.filter(st=>(g.students||[]).includes(st.id));
 const notices=[...db.notifications].filter(a=>(a.recipients||[]).includes(g.id)).sort((a,b)=>b.createdAt-a.createdAt);
 const myRequests=db.requests.filter(r=>r.guardian===g.id);
 const options=db.guardians.map(x=>`<option value="${esc(x.id)}" ${x.id===g.id?'selected':''}>${esc(x.name)} · ${esc(x.relation)}</option>`).join('');
 return `<div class="parent-app">
 <header class="parent-header"><div class="parent-header-top"><div class="parent-brand">✓ SafeRelease<small>FAMILY PORTAL · DEMO</small></div><button class="btn small" onclick="guardianSignOut()">Sign out ↗</button></div><div class="parent-welcome"><div class="eyebrow">WELCOME BACK</div><h1>Hello, ${esc(g.name.split(' ')[0])} 👋</h1><p>Your school updates and student pickup information, all in one place.</p></div></header>
 <div class="parent-body">
 <div class="parent-profile"><div class="parent-avatar">${initials(g.name)}</div><div class="parent-profile-info"><strong>${esc(g.name)}</strong><span>${esc(g.relation)} · ${g.verified?'School verified':'Verification pending'}</span></div><span class="status ready">My account</span></div>
 <section class="parent-section"><div class="parent-section-head"><h2>My students</h2><span>${kids.length} linked</span></div>${kids.length?kids.map(k=>`<div class="parent-student"><div class="parent-student-top"><div class="parent-student-icon">♙</div><div><strong>${esc(k.name)}</strong><small>${esc(k.grade)} · Roll no. ${esc(k.roll||'—')}</small></div></div><div class="parent-student-foot"><span>School status</span><strong>${esc(k.status||'On campus')}</strong></div></div>`).join(''):'<div class="parent-empty">No students are linked to this guardian.</div>'}</section>
 <section class="parent-section"><div class="parent-section-head"><h2>School announcements</h2><span>${notices.length} updates</span></div>${notices.length?notices.map(a=>{const ack=(a.acknowledged||[]).includes(g.id);return `<article class="parent-card"><div class="parent-card-title">${a.type==='Emergency notice'?'⚠ ':''}${esc(a.title)}</div><div class="parent-card-meta">${esc(a.type)} · ${new Date(a.createdAt).toLocaleString()}</div><p>${esc(a.message)}</p>${ack?'<span class="status ready">✓ Acknowledged</span>':`<button class="btn primary small" onclick="guardianAcknowledge('${a.id}')">Acknowledge update</button>`}</article>`}).join(''):'<div class="parent-empty">📣<br><br>No school announcements yet. New updates will appear here.</div>'}</section>
 <section class="parent-section"><div class="parent-section-head"><h2>Request a pickup change</h2><span>Staff approval required</span></div><div class="parent-card"><form class="parent-form" onsubmit="submitGuardianChange(event)"><div class="field"><label>Which student?</label><select id="portalStudent" required ${kids.length?'':'disabled'}>${kids.map(k=>`<option value="${k.id}">${esc(k.name)} · ${esc(k.grade)}</option>`).join('')}</select></div><div class="field"><label>New pickup person's full name</label><input id="portalCollector" required maxlength="80" placeholder="Enter collector's full name" ${kids.length?'':'disabled'}></div><div class="field"><label>Reason for this change</label><textarea id="portalReason" required maxlength="300" rows="3" placeholder="Tell the school why the pickup arrangement needs to change" ${kids.length?'':'disabled'}></textarea></div><button class="btn primary" type="submit" ${kids.length?'':'disabled'}>＋ Submit pickup request</button></form><div class="parent-note">Submitting a request does not approve the pickup. The school must review it, and staff must still verify the collector's identity before releasing a student.</div></div></section>
 <section class="parent-section"><div class="parent-section-head"><h2>My requests</h2><span>${myRequests.length} total</span></div>${myRequests.length?myRequests.map(r=>`<div class="parent-card"><div class="parent-card-title">${esc(student(r.student).name)} · ${esc(r.to)}</div><div class="parent-card-meta">${esc(r.id)} · ${esc(r.reason)}</div><div style="margin-top:10px"><span class="status ${r.status==='Approved'?'ready':r.status==='Rejected'?'flag':'wait'}">${esc(r.status)}</span></div></div>`).join(''):'<div class="parent-empty">You have not submitted any pickup changes.</div>'}</section>
 <div class="parent-footer">SafeRelease · Independent concept prototype<br>Sample data only · Not connected to a live school</div></div></div>`;
}
function exitGuardianPortal(){go('welcome')}
function guardianSignOut(){go('welcome')}
function setPortalGuardian(id){if(!db.guardians.some(g=>g.id===id))return;activeGuardianId=id;render()}
function guardianAcknowledge(alertId){const a=db.notifications.find(x=>x.id===alertId),g=guardian(activeGuardianId);if(!a||(a.recipients||[]).indexOf(g.id)<0)return;a.acknowledged||=[];if(!a.acknowledged.includes(g.id))a.acknowledged.push(g.id);save();render();toast('Announcement acknowledged in demo')}
function submitGuardianChange(e){e.preventDefault();const g=guardian(activeGuardianId),sid=document.getElementById('portalStudent').value,to=document.getElementById('portalCollector').value.trim(),reason=document.getElementById('portalReason').value.trim();if(!sid||!to||!reason)return;db.requests.unshift({id:'CH-'+Date.now(),student:sid,guardian:g.id,from:g.name,to,reason,status:'Pending'});save();render();toast('Pickup change request submitted for school review')}
function toggleAlertGrade(){document.getElementById('alertGradeWrap').style.display=document.getElementById('alertAudience').value==='grade'?'block':'none'}
function createAnnouncement(e){e.preventDefault();const type=document.getElementById('alertType').value,audience=document.getElementById('alertAudience').value,grade=document.getElementById('alertGrade').value.trim();if(audience==='grade'&&!grade){toast('Enter a grade or section');return}const students=audience==='all'?db.students:db.students.filter(s=>s.grade.toLowerCase()===grade.toLowerCase());const recipients=[...new Set(students.flatMap(s=>s.guardians||[]))];if(!recipients.length){toast('No linked guardians found for this audience');return}db.notifications.push({id:'AL-'+Date.now(),type,audience:audience==='all'?'All guardians':grade,title:document.getElementById('alertTitle').value.trim(),message:document.getElementById('alertMessage').value.trim(),recipients,acknowledged:[],createdAt:Date.now()});save();render();toast('Demo announcement created for '+recipients.length+' guardian(s)')}
function acknowledgeAnnouncement(alertId,guardianId){const a=db.notifications.find(x=>x.id===alertId);if(!a||!a.recipients.includes(guardianId))return;if(!a.acknowledged.includes(guardianId))a.acknowledged.push(guardianId);save();render();toast('Acknowledgement recorded in demo')}
function go(p){page=p;searchTerm='';render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.querySelectorAll('.nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openModal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=actions;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function studentModal(){openModal('Add student',`<form id="studentForm" class="form-grid"><div class="field full"><label>Student full name</label><input name="name" required placeholder="e.g. Samir Shrestha"></div><div class="field"><label>Grade / section</label><input name="grade" required placeholder="Grade 4 · A"></div><div class="field"><label>Roll number</label><input name="roll" placeholder="e.g. 12"></div><div class="field full"><label>Authorised guardian</label><select name="guardian" required>${db.guardians.map(g=>`<option value="${g.id}">${esc(g.name)} · ${esc(g.relation)}</option>`).join('')}</select></div></form>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addStudent()">Add student</button>')}
function addStudent(){const f=document.getElementById('studentForm');if(!f.reportValidity())return;const d=new FormData(f),id='ST-'+Math.floor(1000+Math.random()*8999);const g=d.get('guardian');db.students.push({id,name:d.get('name'),grade:d.get('grade'),roll:d.get('roll'),guardians:g?[g]:[],status:'On campus'});if(g){const x=guardian(g);x.students.push(id)}save();closeModal();render();toast('Student added to demo directory')}
function guardianModal(){openModal('Add authorised guardian',`<form id="guardianForm" class="form-grid"><div class="field full"><label>Guardian full name</label><input name="name" required></div><div class="field"><label>Phone number (demo)</label><input name="phone" placeholder="98XXXXXXXX"></div><div class="field"><label>Relationship</label><select name="relation"><option>Mother</option><option>Father</option><option>Guardian</option><option>Grandparent</option><option>Uncle</option><option>Aunt</option><option>Other</option></select></div><div class="field full"><label>Link student</label><select name="student" required>${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.grade)}</option>`).join('')}</select></div></form>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addGuardian()">Add guardian</button>')}
function addGuardian(){const f=document.getElementById('guardianForm');if(!f.reportValidity())return;const d=new FormData(f),id='GU-'+Math.floor(2000+Math.random()*7999),sid=d.get('student');db.guardians.push({id,name:d.get('name'),phone:d.get('phone'),relation:d.get('relation'),students:[sid],verified:false,accountActivated:false});student(sid).guardians.push(id);save();closeModal();render();toast('Guardian added — verification pending')}
function createGuardianInvite(id){const g=guardian(id);if(!g||!g.verified){toast('Verify this guardian against school records first');return}db.invites=db.invites.filter(x=>!(x.guardianId===id&&x.status==='Pending'));const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='SR-';for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];const invite={id:'IN-'+Date.now(),guardianId:id,code,status:'Pending',createdAt:Date.now(),expiresAt:Date.now()+7*24*60*60*1000};db.invites.unshift(invite);save();openModal('Guardian invitation created',`<div class="code-box"><div class="eyebrow">ONE-TIME SCHOOL INVITATION</div><div class="code" style="font-size:22px;letter-spacing:2px">${code}</div><div class="sub">Expires ${new Date(invite.expiresAt).toLocaleString()}</div></div><div class="detail-grid" style="margin-top:14px"><div class="detail"><small>Guardian</small><strong>${esc(g.name)}</strong></div><div class="detail"><small>Guardian ID</small><strong>${esc(g.id)}</strong></div></div><div class="notice">Share this code privately with the verified guardian. No SMS or email is sent by this demo. The code can be used once and expires in 7 days.</div>`,'<button class="btn secondary" onclick="closeModal()">Close</button>');renderGuardianRowsAfterModal()}
function renderGuardianRowsAfterModal(){const el=document.getElementById('guardianRows');if(el)el.innerHTML=guardianRows()}
function verifyGuardian(id){const g=guardian(id);if(!g||!confirm('Confirm that this guardian has been checked against school records?'))return;g.verified=true;save();render();toast('Guardian marked verified in demo')}
function passModal(){openModal('Create pickup pass',`<form id="passForm" class="form-grid"><div class="field full"><label>Student</label><select name="student" id="passStudent" required onchange="updatePassGuardians()">${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.grade)}</option>`).join('')}</select></div><div class="field full"><label>Authorised pickup contact</label><select name="guardian" id="passGuardian" required></select></div><div class="field"><label>Pickup date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Expected time</label><input name="time" type="time" value="15:30" required></div></form><div class="notice">A unique six-digit demo code will be generated. Real codes must be securely generated and expire automatically.</div>`,'<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createPass()">Create pass</button>');updatePassGuardians()}
function updatePassGuardians(){const s=document.getElementById('passStudent');if(!s)return;const g=document.getElementById('passGuardian');g.innerHTML=db.guardians.filter(x=>x.students.includes(s.value)&&x.verified).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.relation)}</option>`).join('');if(!g.options.length)g.innerHTML='<option value="">No verified guardian linked</option>'}
function createPass(){const f=document.getElementById('passForm');if(!f.reportValidity())return;const d=new FormData(f);if(!d.get('guardian')){toast('Link and verify a guardian first');return}let code=String(Math.floor(100000+Math.random()*900000));while(db.passes.some(p=>p.code===code&&p.date===d.get('date')))code=String(Math.floor(100000+Math.random()*900000));const p={id:'PR-'+Math.floor(500+Math.random()*9499),student:d.get('student'),guardian:d.get('guardian'),code,date:d.get('date'),time:d.get('time'),status:'Ready',type:'Regular pickup'};db.passes.unshift(p);save();closeModal();render();showPass(p.id);toast('Pickup pass created')}
function showPass(id){const p=db.passes.find(x=>x.id===id);if(!p)return;const s=student(p.student),g=guardian(p.guardian);openModal('Pickup pass · '+p.id,`<div class="code-box"><div class="eyebrow">ONE-TIME DEMO PICKUP CODE</div><div class="code">${p.code}</div><div class="sub">${fmtDate(p.date)} · ${esc(p.time)}</div><div class="qr-wrap"><div id="qrCode"></div></div><div class="sub" style="margin-top:9px">Show this pass to school staff for verification.</div></div><div class="detail-grid" style="margin-top:14px"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Authorised guardian</small><strong>${esc(g.name)}</strong></div><div class="detail"><small>Pass status</small><strong>${esc(p.status)}</strong></div></div><div class="risk" style="margin-top:12px">Demo only: QR contains a non-sensitive pass reference. Production implementation needs server-side token validation and expiry.</div>`,'<button class="btn secondary" onclick="closeModal()">Close</button><button class="btn primary" onclick="printPass(\''+p.id+'\')">Print pass</button>');if(window.QRCode){new QRCode(document.getElementById('qrCode'),{text:'SAFERELEASE|'+p.id+'|'+p.code,width:132,height:132,colorDark:'#173b68',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else document.getElementById('qrCode').innerHTML='<div style="padding:15px;font-size:11px">QR preview unavailable · use code above</div>'}
function printPass(id){const p=db.passes.find(x=>x.id===id),s=student(p.student),g=guardian(p.guardian);const w=window.open('','_blank');w.document.write('<html><title>SafeRelease pickup pass</title><body style="font-family:Arial;padding:35px;text-align:center"><h1>SafeRelease</h1><h2>Student pickup pass</h2><h1 style="letter-spacing:8px">'+p.code+'</h1><p>Student: '+esc(s.name)+' · '+esc(s.grade)+'</p><p>Authorised guardian: '+esc(g.name)+'</p><p>'+fmtDate(p.date)+' · '+p.time+'</p><p>DEMO ONLY — confirm collector identity with school records.</p></body></html>');w.document.close();w.print()}
function verifyCode(e){e.preventDefault();const code=document.getElementById('verifyInput').value.trim(),p=db.passes.find(x=>x.code===code&&x.date===today());const box=document.getElementById('verifyResult');if(!p){box.innerHTML='<div class="risk">No valid pickup pass found for this code and date. Do not release the student.</div>';return}if(p.status==='Completed'){box.innerHTML='<div class="risk">This pass has already been used. Do not release again.</div>';return}if(p.status!=='Ready'){box.innerHTML='<div class="risk">This pass is not approved for release.</div>';return}const s=student(p.student),g=guardian(p.guardian);box.innerHTML=`<div class="detail-grid"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Authorised guardian</small><strong>${esc(g.name)}</strong></div><div class="detail"><small>Relationship</small><strong>${esc(g.relation)}</strong></div></div><div class="notice">Match the adult's identity against the school's authorised records. A code is not proof of identity.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="confirmHandover('${p.id}')">Confirm verified handover</button>`}
function confirmHandover(id){const p=db.passes.find(x=>x.id===id);if(!p||p.status!=='Ready'){toast('Pass is no longer available');return}if(!confirm('Confirm that you personally checked the collector identity and are releasing '+student(p.student).name+' to '+guardian(p.guardian).name+'?'))return;p.status='Completed';db.history.unshift({id:'HR-'+Math.floor(400+Math.random()*9599),student:p.student,guardian:p.guardian,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:today(),staff:'Demo Admin',method:'Code verified',note:'Identity confirmed by staff'});save();render();toast('Handover recorded in demo history')}
function reviewRequest(id,approve){const r=db.requests.find(x=>x.id===id);if(!r)return;if(!confirm((approve?'Approve':'Reject')+' this pickup change request?'))return;r.status=approve?'Approved':'Rejected';save();render();toast('Request '+r.status.toLowerCase())}
function studentDetail(id){const s=student(id);openModal('Student record',`<div class="detail-grid"><div class="detail"><small>Student</small><strong>${esc(s.name)}</strong></div><div class="detail"><small>Student ID</small><strong>${s.id}</strong></div><div class="detail"><small>Class</small><strong>${esc(s.grade)}</strong></div><div class="detail"><small>Roll number</small><strong>${esc(s.roll)}</strong></div></div><h4 style="font:700 13px Poppins;margin:18px 0 8px">Authorised guardians</h4>${s.guardians.map(id=>`<div class="queue-row"><div class="student-avatar">${initials(guardian(id).name)}</div><div><div class="person-name">${esc(guardian(id).name)}</div><div class="person-meta">${esc(guardian(id).relation)} · ${guardian(id).verified?'Verified':'Pending verification'}</div></div></div>`).join('')||'<div class="sub">No guardian linked.</div>'}`,'<button class="btn secondary" onclick="closeModal()">Close</button>')}
function saveSettings(){db.settings={school:document.getElementById('setSchool').value,releaseStart:document.getElementById('setStart').value,releaseEnd:document.getElementById('setEnd').value,requireCode:document.getElementById('setCode').checked,requireGuardian:document.getElementById('setGuardian').checked};save();toast('Settings saved')}
function exportCSV(){const rows=[['Record ID','Date','Time','Student','Guardian','Staff','Method','Note'],...db.history.map(h=>[h.id,h.date,h.time,student(h.student).name,guardian(h.guardian).name,h.staff,h.method,h.note])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='saferelease-handover-history.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared')}
function resetDemo(){if(!confirm('Reset all demo records to the original sample data?'))return;db=structuredClone(seed);save();render();toast('Demo data reset')}
render();
</script>
